name: Exact matrix.asset_name sink proof

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Harmless marker test value; run only in this fork"
        required: true
        type: string

permissions: {}

jobs:
  proof:
    name: Exact matrix.asset_name sink reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    strategy:
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            path: target/x86_64-unknown-linux-gnu/release/function-runner
            asset_name: function-runner-x86_64-linux-${{ inputs.tag_name }}

    steps:
      - name: Create synthetic build artifact
        shell: bash
        run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          printf 'synthetic isolated test artifact\n' > target/x86_64-unknown-linux-gnu/release/function-runner

      - name: Archive assets (same shell sink as Shopify build.yml)
        shell: bash
        run: gzip -k -f ${{ matrix.path }} && mv ${{ matrix.path }}.gz ${{ matrix.asset_name }}.gz

      - name: Verify marker side effect
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/CI_INJECTION_PROOF" ]]; then
            echo "EXACT_MATRIX_ASSET_NAME_SINK=PASS"
            echo "CI_INJECTION_PROOF=PASS"
            printf 'MARKER_CONTENT='
            cat "$RUNNER_TEMP/CI_INJECTION_PROOF"
          else
            echo "EXACT_MATRIX_ASSET_NAME_SINK=FAIL"
            echo "CI_INJECTION_PROOF=FAIL"
            exit 1
          fi
