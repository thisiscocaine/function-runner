name: CI Injection Proof (temporary)

on:
  push:
    branches:
      - ci-injection-proof-20261107
    paths:
      - .github/workflows/ci-injection-proof.yml

permissions: {}

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Interpolate untrusted commit message into shell (marker-only proof)
        shell: bash
        run: |
          printf 'COMMIT_MESSAGE=%s\n' ${{ github.event.head_commit.message }}

      - name: Verify marker created by the injected command
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/CI_INJECTION_PROOF" ]; then
            echo "CI_INJECTION_PROOF=PASS"
            echo "MARKER_CONTENT=$(cat "$RUNNER_TEMP/CI_INJECTION_PROOF")"
          else
            echo "CI_INJECTION_PROOF=FAIL"
            exit 1
          fi
