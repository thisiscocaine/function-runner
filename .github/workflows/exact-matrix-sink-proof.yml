name: Exact matrix.asset_name artifact integrity proof

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Synthetic test tag input; fork only"
        required: true
        type: string

permissions:
  contents: read

jobs:
  proof:
    name: Exact matrix.asset_name artifact integrity reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: x86_64-unknown-linux-gnu
            path: target/x86_64-unknown-linux-gnu/release/function-runner
            asset_name: function-runner-x86_64-linux-${{ inputs.tag_name }}

    steps:
      - name: Checkout fork with persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Create synthetic build artifact
        shell: bash
        run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          printf 'SYNTHETIC_RELEASE_ARTIFACT_ORIGINAL\n' > target/x86_64-unknown-linux-gnu/release/function-runner

      - name: Archive assets (same shell sink as Shopify build.yml)
        shell: bash
        run: gzip -k -f ${{ matrix.path }} && mv ${{ matrix.path }}.gz ${{ matrix.asset_name }}.gz

      - name: Verify synthetic release artifact content
        if: always()
        shell: bash
        run: |
          target='function-runner-x86_64-linux-probe.gz'
          unpacked="$RUNNER_TEMP/verified-synthetic-artifact"

          if ! gzip -t "$target" 2>/dev/null; then
            echo "SYNTHETIC_RELEASE_ARTIFACT_TAMPERING=NOT_VERIFIED"
            echo "ARTIFACT_GZIP_VALID=NO"
            exit 1
          fi

          gzip -dc "$target" > "$unpacked"

          if grep -aFq 'SYNTHETIC_RELEASE_ARTIFACT_ORIGINAL' "$unpacked" &&
             grep -aFq 'SYNTHETIC_ARTIFACT_TAMPER_MARKER' "$unpacked"; then
            echo "SYNTHETIC_RELEASE_ARTIFACT_TAMPERING=PASS"
            echo "ORIGINAL_CONTENT=PRESENT"
            echo "INJECTED_MARKER=FOUND_INSIDE_COMPRESSED_ARTIFACT"
            echo "ARTIFACT_GZIP_VALID=YES"
            sha256sum "$target"
          else
            echo "SYNTHETIC_RELEASE_ARTIFACT_TAMPERING=FAIL"
            exit 1
          fi
